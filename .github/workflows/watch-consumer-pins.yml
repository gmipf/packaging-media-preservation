name: watch-consumer-pins

# The consumer pins now have FIXED names and a moving version (redumper-mpf,
# redumper-rgui, aaru5), so tracking a consumer's bundled build is a plain
# in-place version bump -- no new package, no orphan. This watcher does that
# hourly for the one pin whose source moves on a rolling basis:
#
#   redumper-mpf  <- the redumper build in MPF's publish-nix.sh. Our mpf package
#                    is itself rolling (tracks MPF main hourly), so the same source
#                    is the right one for its pin. AUTO-BUMPED here.
#
# The other two are coupled to sources that are NOT hourly, and auto-bumping them
# would ship a combination nobody tested -- so they are GUARDED, not bumped, and a
# drift fails loudly (same contract as watch-aaru-releases: stop and mail, never
# build on silently):
#
#   aaru5         <- MPF bundles a STABLE aaru (5.4.x); it moves rarely and its
#                    repackage is a NativeAOT tree with a static manpage, not a zip.
#                    On drift: bump by hand (Version + Source tag + gen-deb).
#   redumper-rgui <- the redumper build bundled by the redumper-gui RELEASE we
#                    package (b729 for 1.0.1). redumper-gui is not hourly-tracked;
#                    when it is rebuilt to a new upstream release, bump redumper-rgui
#                    in the SAME change. Deliberately no version pinned here -- a
#                    hardcoded build number in this file is exactly the second-place
#                    landmine feedback_packit_version_from_spec warns about, so the
#                    coupling lives with redumper-gui, not in a watcher literal.

on:
  schedule:
    - cron: '47 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.sync.outputs.changed }}
    steps:
      - uses: actions/checkout@v5

      - name: Track MPF's redumper pin; guard aaru5
        id: sync
        run: |
          set -euo pipefail

          NIX=$(curl -fsSL https://raw.githubusercontent.com/SabreTools/MPF/master/publish-nix.sh)
          MPF_RD=$(printf '%s' "$NIX" | grep -oE 'redumper/releases/download/b[0-9]+' | head -1 | grep -oE '[0-9]+$')
          MPF_AA=$(printf '%s' "$NIX" | grep -oE 'Aaru/releases/download/v[0-9.]+'    | head -1 | sed 's/.*v//')
          [ -n "$MPF_RD" ] || { echo "::error::could not read a redumper b<N> build from MPF publish-nix.sh -- upstream layout changed"; exit 1; }
          [ -n "$MPF_AA" ] || { echo "::error::could not read an Aaru version from MPF publish-nix.sh -- upstream layout changed"; exit 1; }

          # ---- aaru5 guard (live values, nothing hardcoded) ----
          AA_PIN=$(grep -oP '^Version:\s+\K\S+' fedora/aaru5/aaru5.spec)
          if [ "$MPF_AA" != "$AA_PIN" ]; then
            echo "::error::MPF now bundles Aaru ${MPF_AA} but aaru5 is ${AA_PIN}. aaru5 is a stable-release NativeAOT repackage with a curated manpage, not a zip -- bump it by hand (fedora+opensuse Version, Source tag, scripts/obs/gen-deb.sh aaru5) rather than auto-shipping a build MPF may not have been tested against."
            exit 1
          fi
          echo "aaru5 guard ok: MPF bundles Aaru ${MPF_AA}, aaru5 is ${AA_PIN}"

          # ---- redumper-mpf: the one we auto-track ----
          MPF_PIN=$(grep -oP '^%global rdbuild \K[0-9]+' fedora/redumper-mpf/redumper-mpf.spec)
          if [ "$MPF_PIN" = "$MPF_RD" ]; then
            echo "redumper-mpf already at b${MPF_RD} -- nothing to do"
            exit 0
          fi
          echo "MPF moved its bundled redumper: b${MPF_PIN} -> b${MPF_RD}"

          command -v rpmspec >/dev/null || sudo apt-get install -y -qq rpm >/dev/null
          bash scripts/bump-pin.sh redumper-mpf "$MPF_RD"

          git add fedora/redumper-mpf opensuse/redumper-mpf ubuntu/redumper-mpf
          if git diff --cached --quiet; then
            echo "bump produced no change -- exiting clean"; exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"

          git config user.name  "consumer-pins-watcher"
          git config user.email "actions@github.com"
          git commit -m "chore: redumper-mpf -> b${MPF_RD} (MPF bundle moved)"

          # main can move under us (another watcher / a human). Rebase and retry,
          # fail loudly only if it still will not go -- same shape as the other
          # watchers; a silently-dropped bump is the failure mode to avoid.
          pushed=
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then pushed=1; break; fi
            echo "::warning::push to main rejected (attempt $attempt) -- rebasing onto the new tip"
            git fetch -q origin main
            git rebase origin/main
          done
          [ -n "$pushed" ] || { echo "::error::could not push to main after 3 attempts"; exit 1; }

          git checkout -q -b trigger-tmp
          printf '# build-redumper-mpf — redumper-mpf (Fedora/COPR trigger branch)\n\nAuto-managed **trigger branch** for the `redumper-mpf` pin: a push here fires\nthat one COPR build via Packit, nothing else rebuilds. Canonical source is\n`main` (do not edit here). Packaging: `fedora/redumper-mpf/`.\n' > README.md
          git add README.md
          git commit -q -m "trigger: redumper-mpf build (branch landing README)"
          git push -f origin trigger-tmp:build-redumper-mpf

  obs:
    needs: watch
    if: needs.watch.outputs.changed == 'true'
    uses: ./.github/workflows/obs-trigger.yml
    secrets: inherit
