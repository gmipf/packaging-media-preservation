name: watch-consumer-pins

# The consumer pins have FIXED names and a moving version (redumper-mpf, aaru5,
# redumper-rgui), so following a consumer's bundled build is a plain in-place
# version bump -- no new package, no orphan. This watcher tracks the two that MPF
# bundles, reading both out of MPF's own publish-nix.sh:
#
#   redumper-mpf  <- the redumper build MPF bundles
#   aaru5         <- the stable Aaru release MPF bundles
#
# aaru5 was GUARDED rather than bumped until 2026-07-19, on the stated grounds
# that it is "a NativeAOT tree with a static manpage, not a zip" and that
# auto-bumping would ship an untested combination. Checked against the recipes,
# neither half held: aaru5's manpage is GENERATED at build time from
# aaru5-manpage.sh, exactly like the rolling aaru package, and that one is a
# NativeAOT tree too and has been auto-bumped all along. The untested-combination
# argument is backwards as well -- the version MPF bundles is precisely the one
# MPF tested. What actually differed was one macro name and a `Version:` line that
# repeated the literal 5.4.2 instead of following %{aaruver}. A reason written
# down once and never re-checked kept a package on manual maintenance for weeks.
#
#   redumper-rgui <- NOT here. It follows the redumper-gui RELEASE, so it is bumped
#                    by watch-redumper-gui.yml, in the same commit as the GUI, from
#                    REDUMPER_VERSION in that release's own build.yml. Deliberately
#                    no version literal in either file: a hardcoded build number is
#                    exactly the second-place landmine feedback_packit_version_from_spec
#                    warns about -- and on 2026-07-19 that landmine went off, in
#                    .packit.yaml, for this very pin.

# full-automation-exception: aaru5 — the Aaru version is read from MPF's publish-nix.sh WITHOUT a major constraint, and MPF is moving to Aaru 6: the day it lists a 6.x, an auto-bump would push the package named aaru5 to 6.0.0 and its name would stop describing its content. Reported and stopped instead (exception: user 2026-07-19; reason replaced Boot 6 2026-07-22 — the original proof-state reason died when the vendor-cap rows went not-yet)
#
# The line above is what status.sh prints, so it has to stand on its own -- only the
# first line carries the marker. Declared in a form the check reads, so the rule
# reports this as an ACKNOWLEDGED exception instead of either crying wolf forever or
# quietly ignoring it. Delete that line and the handoff below counts as a violation
# again, which is the point: the exception has to be re-stated to keep existing.

on:
  schedule:
    - cron: '47 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.sync.outputs.changed }}
    steps:
      - uses: actions/checkout@v5

      - name: Track the pins MPF bundles
        id: sync
        run: |
          set -euo pipefail

          NIX=$(curl -fsSL https://raw.githubusercontent.com/SabreTools/MPF/master/publish-nix.sh)
          MPF_RD=$(printf '%s' "$NIX" | grep -oE 'redumper/releases/download/b[0-9]+' | head -1 | grep -oE '[0-9]+$')
          MPF_AA=$(printf '%s' "$NIX" | grep -oE 'Aaru/releases/download/v[0-9.]+'    | head -1 | sed 's/.*v//')
          [ -n "$MPF_RD" ] || { echo "::error::could not read a redumper b<N> build from MPF publish-nix.sh -- upstream layout changed"; exit 1; }
          [ -n "$MPF_AA" ] || { echo "::error::could not read an Aaru version from MPF publish-nix.sh -- upstream layout changed"; exit 1; }

          command -v rpmspec >/dev/null || sudo apt-get install -y -qq rpm >/dev/null
          BUMPED=""

          # Read each pin from the MACRO that drives it, never from the Version:
          # line. aaru5's Version: follows %{aaruver} as of 2026-07-19, so a grep
          # for '^Version:' there returns the literal text "%{aaruver}" -- it would
          # have compared that against 5.4.2 and reported a drift on every run.
          # The macro is also what bump-pin.sh writes, so reader and writer agree
          # by construction.
          # The spec path is SPELLED OUT, not derived from the name, and that is
          # deliberate twice over. It shows at a glance which recipes this watcher
          # touches -- and status.sh's coverage check looks for exactly
          # `fedora/<pkg>/` in executable (comment-stripped) workflow code to prove
          # a package is tracked by something. Written as "fedora/$name/" it finds
          # nothing, and both pins report as untracked while being bumped perfectly
          # well. Measured on 2026-07-19: the first version of this loop did exactly
          # that, and the check caught it. Do not "simplify" these back into the
          # variable -- it would silently blind the control that enforces the rule.
          # Field 5 is the POLICY: auto = bump it, guard = report and stop.
          #
          # aaru5 is `guard`, and it is the ONE deliberate exception to the
          # full-automation rule (decided 2026-07-19, by the user, after the
          # machinery to auto-bump it was already built and pushed in 8abf5a4).
          # The reason is not "it is hard" -- bump-pin.sh handles it fine and the
          # local 5.4.2 -> 5.5.0 run proved that.
          #
          # THE REASON, as of 2026-07-22: the version above is read out of MPF's
          # publish-nix.sh with `Aaru/releases/download/v[0-9.]+`, which does NOT
          # constrain the major. MPF is on its way to Aaru 6, and the
          # day publish-nix.sh lists a 6.x, an `auto` policy here would bump the
          # package called aaru5 to 6.0.0 -- a name that no longer describes its
          # content, delivered to installed systems by a plain `upgrade`. That is
          # the aaru5 RETIREMENT, and a retirement is a decision, not a bump.
          #
          # The reason this exception was FIRST written down (2026-07-19) was a
          # proof obligation: aaru5's three vendor-cap rows would have their target
          # moved underneath them. That reason is DEAD, and both halves of how it
          # died are worth keeping:
          #   - the rows said `blocked:5.4.2` because "aaru5 crashes before any
          #     optical read". That was OUR harness, not aaru5: the runs went over
          #     ssh and carried no TERM, so Console.WindowWidth was 0 and the
          #     progress bar threw on `new String(' ', -1)`.
          #     See proofs/aaru5-vendor-cap-RETRACTED-x86_64.md.
          #   - measured on hardware 2026-07-21: over a full audio-CD dump aaru5
          #     issues NO opcode >= 0xC0 at all -- uncapped, capped, or as root.
          #     The capability is not load-bearing for it, so there is no red half
          #     to be had. The rows are `not-yet` and stand for the untested
          #     ATA/SATA case only. See proofs/aaru5-optical-dump-MEASURED-x86_64.md.
          # A version bump can void neither, and mech_hash covers only the
          # mechanism slice, so it does not move on a Version: line either.
          # ⭐ The guard was right for four days for a reason that was wrong. Check
          # what an exception PROTECTS when the thing it named changes state.
          #
          # So the drift is reported and a human decides -- and status.sh carries
          # this exception EXPLICITLY rather than counting it as a violation, so
          # the rule check stays meaningful.
          for entry in "redumper-mpf rdbuild $MPF_RD fedora/redumper-mpf/redumper-mpf.spec auto" \
                       "aaru5 aaruver $MPF_AA fedora/aaru5/aaru5.spec guard"; do
            set -- $entry
            name=$1 macro=$2 want=$3 spec=$4 policy=$5
            have=$(grep -oP "^%global[[:space:]]+${macro}[[:space:]]+\K\S+" "$spec")
            [ -n "$have" ] || { echo "::error::$spec has no '%global $macro' line"; exit 1; }
            if [ "$have" = "$want" ]; then
              echo "$name already at $want"
              continue
            fi
            if [ "$policy" = guard ]; then
              echo "::error::MPF now bundles $name $want but we ship $have. This pin is deliberately NOT auto-bumped: the version is read from MPF's publish-nix.sh without a major-version constraint, so CHECK THE MAJOR FIRST. Same major -> scripts/bump-pin.sh $name $want. New major (5.x -> 6.x) -> this is NOT a bump: the package named aaru5 must not carry an Aaru 6, that is the aaru5 retirement, and it is decided by a human."
              exit 1
            fi
            echo "MPF moved its bundled $name: $have -> $want"
            bash scripts/bump-pin.sh "$name" "$want"
            BUMPED="${BUMPED}${name} "
          done

          if [ -z "$BUMPED" ]; then
            echo "neither pin moved -- nothing to do"
            exit 0
          fi

          for p in $BUMPED; do git add "fedora/$p" "opensuse/$p" "ubuntu/$p"; done
          if git diff --cached --quiet; then
            echo "bump produced no change -- exiting clean"; exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"

          git config user.name  "consumer-pins-watcher"
          git config user.email "actions@github.com"
          git commit -m "chore: pins follow MPF's bundle (${BUMPED% })"

          # main can move under us (another watcher / a human). Rebase and retry,
          # fail loudly only if it still will not go -- same shape as the other
          # watchers; a silently-dropped bump is the failure mode to avoid.
          pushed=
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then pushed=1; break; fi
            echo "::warning::push to main rejected (attempt $attempt) -- rebasing onto the new tip"
            git fetch -q origin main
            git rebase origin/main
          done
          [ -n "$pushed" ] || { echo "::error::could not push to main after 3 attempts"; exit 1; }

          # ONE TRIGGER BRANCH PER BUMPED PACKAGE. Each Packit job watches exactly
          # one branch, so a commit that moves two pins needs two pushes -- pushing
          # only one leaves the other sitting in main, built by nobody, with no red
          # build anywhere to find it. That is not hypothetical: it is what happened
          # to redumper-rgui b733 on 2026-07-19. Until today this watcher could only
          # ever move one pin, so the shape was latent rather than wrong.
          trigger() {
            git checkout -q -B trigger-tmp
            printf '# build-%s — %s (Fedora/COPR trigger branch)\n\nAuto-managed **trigger branch**: a push here fires that one COPR build via\nPackit, nothing else rebuilds. Canonical source is `main` (do not edit here).\nPackaging: `fedora/%s/`.\n' "$1" "$1" "$1" > README.md
            git add README.md
            git commit -q -m "trigger: $1 build (branch landing README)"
            git push -f origin "trigger-tmp:build-$1"
            git reset -q --hard HEAD~1
          }
          for p in $BUMPED; do trigger "$p"; done

  obs:
    needs: watch
    if: needs.watch.outputs.changed == 'true'
    uses: ./.github/workflows/obs-trigger.yml
    secrets: inherit
