name: ppa-upload

# Reusable workflow: build a SIGNED Debian *source* package for <tool> (both
# series) and dput it to the Launchpad PPA. Called by each watch-<tool> workflow
# after it has committed the bumped ubuntu/<tool>/debian/changelog + marker to
# main. Launchpad then compiles the .debs on its own build farm — the PPA
# counterpart to the fedora/ lane's Packit->COPR trigger.
#
# Signing uses the dedicated, passphrase-less, SIGN-ONLY packaging key
# (fingerprint below) stored as the PPA_SIGNING_KEY Actions secret (an
# ASCII-armored secret key). This is the PUBLIC media-preservation project, not
# Safetyfy, so a signing key in a GitHub secret is in scope. If the secret is
# unset the job skips gracefully (so scheduled runs are not red before setup).
#
# Set the secret once (run it yourself so the key never leaves your machine
# except to GitHub):
#   gpg --export-secret-keys --armor F95E3A17D02ED2D53C54DA78E2E956CC4B250741 \
#     | gh secret set PPA_SIGNING_KEY --repo gmipf/packaging-media-preservation

# workflow_call: the watch-<tool> jobs invoke this after an upstream bump.
# workflow_dispatch: manual route for a packaging-only revision (a -2 stanza with
#   no upstream change). The watchers only reach the ppa job when they detect new
#   upstream, and aaru5 is version-pinned with no watcher at all, so without this
#   a doc/udev-only rebuild could never reach the PPA.
on:
  workflow_call:
    inputs:
      tool:
        description: 'ubuntu/<tool> recipe directory (= Debian source package name)'
        required: true
        type: string
      series:
        description: 'Which series to upload: all, resolute, noble or jammy'
        required: false
        default: all
        type: string
  workflow_dispatch:
    inputs:
      tool:
        description: 'ubuntu/<tool> recipe directory (= Debian source package name)'
        required: true
        type: choice
        options: [redumper, redumper729, redumper732, mpf, aaru, aaru5, discimagecreator, redumper-gui]
      series:
        # redumper-gui MUST be uploaded as series=resolute, never `all`: eframe/
        # egui 0.35 requires rustc 1.92, and the newest VERSIONED toolchain jammy
        # or noble carries is rustc-1.91 (measured -- there is no rustc-1.92 in
        # either archive, backports included). Those series cannot build it at
        # all, so an `all` upload would just queue two guaranteed failures.
        description: 'Which series to upload (retry one after a transient dput failure). redumper-gui: resolute ONLY.'
        required: false
        default: all
        type: choice
        options: [all, resolute, noble, jammy]

permissions:
  contents: read

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main (with the just-committed changelog bump)
        # ref: main (not the triggering SHA) so we pick up the commit the watch
        # job pushed moments ago — assemble.sh reads the new version from it.
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Install Debian source-packaging tooling
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            debhelper dpkg-dev devscripts dput gnupg \
            curl ca-certificates unzip xz-utils \
            meson ninja-build pkg-config

      - name: Build signed source packages and upload to the PPA
        env:
          PPA_SIGNING_KEY: ${{ secrets.PPA_SIGNING_KEY }}
        run: |
          set -euo pipefail
          TOOL='${{ inputs.tool }}'
          KEYID=F95E3A17D02ED2D53C54DA78E2E956CC4B250741
          PPA=ppa:dreunion61/media-preservation
          RECIPE="ubuntu/$TOOL"

          if [ -z "${PPA_SIGNING_KEY:-}" ]; then
            echo "::warning::PPA_SIGNING_KEY secret is not set — skipping PPA upload for $TOOL."
            echo "Set it once with:"
            echo "  gpg --export-secret-keys --armor $KEYID | gh secret set PPA_SIGNING_KEY --repo gmipf/packaging-media-preservation"
            exit 0
          fi

          # Import the passphrase-less signing key into a throwaway keyring on
          # this ephemeral runner (destroyed with the VM after the job).
          export GNUPGHOME
          GNUPGHOME=$(mktemp -d); chmod 700 "$GNUPGHOME"
          printf '%s\n' "$PPA_SIGNING_KEY" | gpg --batch --import
          echo ":: imported signing key $KEYID"

          # Build + upload each series SEQUENTIALLY (never in parallel: the
          # shared .orig tarball is byte-identical across series and Launchpad
          # dedups it on first upload; a concurrent second upload could race).
          #
          # Whether to ship the orig depends on the Debian revision. Launchpad
          # stores ONE immutable <src>_<upstream>.orig.tar.xz forever and
          # rejects any upload whose .dsc records a different checksum for it.
          #   -1  = new upstream version. Launchpad has no orig yet, so send it
          #         (-sa). Both series build the same bytes, so the second one
          #         dedups. This is the path every watcher takes.
          #   -2+ = packaging-only revision. assemble.sh fetches the stored orig
          #         instead of rebuilding it, so the .dsc checksum matches; the
          #         file itself is then left out of the upload (-sd).
          # -d skips the build-dep check (source-only upload: Launchpad compiles).
          FULLVER=$(dpkg-parsechangelog -l "$RECIPE/debian/changelog" -SVersion)
          if [ "${FULLVER##*-}" = "1" ]; then SRCOPT=-sa; else SRCOPT=-sd; fi

          # A version Launchpad already has is REJECTED -- and the rejection is
          # invisible: dput reports success, the job goes green, and the new
          # version simply never appears anywhere. (Acceptance is asynchronous and
          # a rejected upload shows up in no API at all; the only proof of an
          # accepted upload is the version turning up as Pending.) That is a
          # silence worth breaking BEFORE we sign anything: forget the changelog
          # entry on a packaging-only change and this is exactly what happens.
          #
          # The archive is public, so this needs no credential.
          PUB=$(curl -fsSL "https://api.launchpad.net/1.0/~${LP_OWNER:-dreunion61}/+archive/ubuntu/${LP_PPA:-media-preservation}?ws.op=getPublishedSources&source_name=${TOOL}&exact_match=true" \
                | jq -r --arg v "$FULLVER" \
                  '[.entries[] | select(.source_package_version | startswith($v + "~"))] | length' 2>/dev/null || echo 0)
          if [ "${PUB:-0}" -gt 0 ]; then
            echo "::error::$TOOL $FULLVER is already in the PPA ($PUB series). Launchpad rejects a"
            echo "::error::re-upload of a known version, and it does so SILENTLY -- dput would report"
            echo "::error::success and nothing would change. Add a debian/changelog entry first."
            exit 1
          fi

          # ppa.launchpad.net's FTP endpoint intermittently answers the second
          # upload of a run with "550 ... internal server error". Retry rather
          # than leave one series behind; `series:` can re-run just one.
          # resolute = 24.04's successor and the current LTS. It was missing for a
          # while, which made the packages uninstallable on it: ${dep:icu} is
          # resolved per series at build time, so the noble build depends on
          # libicu74 and 26.04 only ships libicu78.
          case "${{ inputs.series }}" in
            resolute|noble|jammy) SERIES_LIST="${{ inputs.series }}" ;;
            *)                    SERIES_LIST="resolute noble jammy" ;;
          esac
          echo ":: $TOOL $FULLVER -> dpkg-buildpackage $SRCOPT, series: $SERIES_LIST"

          for SERIES in $SERIES_LIST; do
            echo "::group::$TOOL $SERIES"
            WORK=$(mktemp -d)
            bash scripts/deb/assemble.sh "$TOOL" "$SERIES" "$RECIPE" "$WORK"
            VER=${FULLVER%-*}
            ( cd "$WORK/${TOOL}-${VER}" && dpkg-buildpackage -S "$SRCOPT" -d -k"$KEYID" )
            CHANGES=$(ls -1 "$WORK"/${TOOL}_*_source.changes | head -1)
            gpg --verify "$CHANGES" 2>&1 | sed -n '1,3p' || true

            ok=
            for attempt in 1 2 3; do
              if dput "$PPA" "$CHANGES"; then ok=1; break; fi
              echo "::warning::dput attempt $attempt for $TOOL $SERIES failed; retrying in $((attempt * 30))s"
              rm -f "$WORK"/*.upload          # dput skips a .changes it thinks it already sent
              sleep $((attempt * 30))
            done
            [ -n "$ok" ] || { echo "::error::dput failed 3x for $TOOL $SERIES"; exit 1; }

            echo ":: uploaded $TOOL $SERIES (${FULLVER}~${SERIES}1)"
            echo "::endgroup::"
          done
          echo ":: PPA upload complete — Launchpad will build the .debs and email results."
