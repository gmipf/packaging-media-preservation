name: watch-dic-releases

# DIC is packaged from a pinned master COMMIT, not the release tag. master
# carries the accumulated Linux fixes -- notably the fd (floppy) SIGSEGV fix
# (#328) -- that the last release tag (20260101) lacks. This watcher polls
# master HEAD and, on a new commit, re-pins the spec to that exact SHA and
# rebuilds (mpf-style rolling snapshot). Every build stays pinned to a full
# 40-char commit SHA recorded in Version, the marker and git history, so it
# is reproducible despite tracking a moving branch. dicbasever is refreshed
# from the latest release tag so the post-release caret base stays current.

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Sync discimagecreator spec with upstream master commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          SPEC=fedora/discimagecreator/discimagecreator.spec
          MARKER=fedora/discimagecreator/.upstream-tag

          UPSTREAM_SHA_FULL=$(gh api repos/saramibreak/DiscImageCreator/branches/master --jq '.commit.sha')
          LOCAL_SHA=$(cat "$MARKER" 2>/dev/null || echo none)

          if [ "$UPSTREAM_SHA_FULL" = "$LOCAL_SHA" ]; then
            echo "Master SHA unchanged ($LOCAL_SHA) — no rebuild needed"
            exit 0
          fi

          UPSTREAM_SHA=${UPSTREAM_SHA_FULL:0:8}
          # Compact UTC commit timestamp (YYYYMMDDHHMMSS) of that commit.
          UPSTREAM_DATE=$(gh api repos/saramibreak/DiscImageCreator/branches/master --jq '.commit.commit.committer.date')
          UPSTREAM_TS=$(printf '%s' "$UPSTREAM_DATE" | tr -d -- '-:TZ' | head -c 14)
          # Base = latest release tag (the version DIC's own AppVersion is cut
          # from); master snapshots sort AFTER it via the caret in the spec.
          BASEVER=$(gh api repos/saramibreak/DiscImageCreator/releases/latest --jq '.tag_name')

          echo "Upstream master: base=$BASEVER sha=$UPSTREAM_SHA ts=$UPSTREAM_TS"
          echo "$UPSTREAM_SHA_FULL" > "$MARKER"

          # Rolling snapshot lives in three %global lines. Rewrite base,
          # snapshot (<UTC-TS>.<short-SHA>) and the full-SHA archive pin, then
          # reset Release to 1: a new snapshot is a fresh identity, so the
          # packaging-iteration counter starts over. RPM sorts on Version
          # first, so -1 still supersedes the previous snapshot's -N.
          sed -i "s/^%global dicbasever .*/%global dicbasever   ${BASEVER}/"                  "$SPEC"
          sed -i "s/^%global dicsnap .*/%global dicsnap      ${UPSTREAM_TS}.${UPSTREAM_SHA}/"  "$SPEC"
          sed -i "s/^%global diccommit .*/%global diccommit    ${UPSTREAM_SHA_FULL}/"          "$SPEC"
          sed -i "s/^Release:.*/Release:        1%{?dist}/"                                     "$SPEC"

          # Prepend a %changelog entry for the new snapshot. EVR is written
          # without %{?dist} to match the existing hand-written entries.
          CL_ENTRY=$(mktemp)
          {
            printf '* %s gmipf <gmipf64@gmail.com> - %s^%s.%s-1\n' \
              "$(LC_ALL=C date -u +'%a %b %d %Y')" "$BASEVER" "$UPSTREAM_TS" "$UPSTREAM_SHA"
            printf -- '- Automated master-snapshot sync to upstream DiscImageCreator commit\n'
            printf '  %s (committed %s UTC); Release reset to 1.\n' "$UPSTREAM_SHA" "$UPSTREAM_TS"
            printf '\n'
          } > "$CL_ENTRY"
          sed -i "/^%changelog/r $CL_ENTRY" "$SPEC"
          rm -f "$CL_ENTRY"

          git add "$SPEC" "$MARKER"
          if git diff --cached --quiet; then
            echo "Spec and marker unchanged after rewrite — exiting clean"
            exit 0
          fi

          git config user.name "rolling-watcher"
          git config user.email "actions@github.com"
          git commit -m "chore: discimagecreator master ${UPSTREAM_SHA} @ ${UPSTREAM_TS}"
          # Trigger branch = main's tree + a short, branch-specific landing
          # README (purely cosmetic: a distinct view per branch when browsing
          # GitHub). That one-file diff means build-dic is no longer a
          # fast-forward of main, so we recreate it and force-push — harmless,
          # since trigger refs are disposable and nobody branches off them.
          # Fires ONLY the discimagecreator job; other tools keep their
          # NEVRA; main stays canonical and builds nothing.
          # Manual single build:  scripts/build-tool.sh dic  (Weg B+ guard
          # auto-bumps Release; never hand-push main:build-dic unguarded)
          git push origin HEAD:main
          git checkout -q -b trigger-tmp
          printf '# build-dic — DiscImageCreator (Fedora/COPR trigger branch)\n\nAuto-managed **trigger branch** for the `discimagecreator` package: a push\nhere fires its COPR build via Packit, nothing else rebuilds. Canonical\nsource is `main` (do not edit here). Packaging: `fedora/discimagecreator/`.\n' > README.md
          git add README.md
          git commit -q -m "trigger: discimagecreator build (branch landing README)"
          git push -f origin trigger-tmp:build-dic
