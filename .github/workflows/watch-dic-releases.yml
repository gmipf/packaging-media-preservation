name: watch-dic-releases

# DIC is packaged from a pinned master COMMIT, not the release tag. master
# carries the accumulated Linux fixes -- notably the fd (floppy) SIGSEGV fix
# (#328) -- that the last release tag (20260101) lacks. This watcher polls
# master HEAD and, on a new commit, re-pins the spec to that exact SHA and
# rebuilds (mpf-style rolling snapshot). Every build stays pinned to a full
# 40-char commit SHA recorded in Version, the marker and git history, so it
# is reproducible despite tracking a moving branch. The version is just the
# commit's UTC timestamp plus short SHA (<YYYYMMDDHHMMSS>.<short-SHA>) -- DIC
# has no semantic source version, so no release-tag anchor is used.

on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.sync.outputs.changed }}
    steps:
      - uses: actions/checkout@v5

      - name: Sync discimagecreator spec with upstream master commit
        id: sync
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          SPEC=fedora/discimagecreator/discimagecreator.spec
          MARKER=fedora/discimagecreator/.upstream-tag

          UPSTREAM_SHA_FULL=$(gh api repos/saramibreak/DiscImageCreator/branches/master --jq '.commit.sha')
          LOCAL_SHA=$(cat "$MARKER" 2>/dev/null || echo none)

          if [ "$UPSTREAM_SHA_FULL" = "$LOCAL_SHA" ]; then
            echo "Master SHA unchanged ($LOCAL_SHA) — no rebuild needed"
            exit 0
          fi

          UPSTREAM_SHA=${UPSTREAM_SHA_FULL:0:8}
          # Compact UTC commit timestamp (YYYYMMDDHHMMSS) of that commit.
          UPSTREAM_DATE=$(gh api repos/saramibreak/DiscImageCreator/branches/master --jq '.commit.commit.committer.date')
          UPSTREAM_TS=$(printf '%s' "$UPSTREAM_DATE" | tr -d -- '-:TZ' | head -c 14)

          echo "Upstream master: sha=$UPSTREAM_SHA ts=$UPSTREAM_TS"
          echo "$UPSTREAM_SHA_FULL" > "$MARKER"

          # Rolling snapshot lives in two %global lines: the snapshot
          # (<UTC-TS>.<short-SHA>, which IS the whole Version) and the full-SHA
          # archive pin. Rewrite both and reset Release to 1: a new snapshot is
          # a fresh identity, so the packaging-iteration counter starts over.
          # RPM sorts on Version first, so -1 still supersedes the previous
          # snapshot's -N.
          sed -i "s/^%global dicsnap .*/%global dicsnap      ${UPSTREAM_TS}.${UPSTREAM_SHA}/"  "$SPEC"
          sed -i "s/^%global diccommit .*/%global diccommit    ${UPSTREAM_SHA_FULL}/"          "$SPEC"
          sed -i "s/^Release:.*/Release:        1%{?dist}/"                                     "$SPEC"

          # Prepend a %changelog entry for the new snapshot. EVR is written
          # without %{?dist} to match the existing hand-written entries.
          CL_ENTRY=$(mktemp)
          {
            printf '* %s gmipf <gmipf64@gmail.com> - %s.%s-1\n' \
              "$(LC_ALL=C date -u +'%a %b %d %Y')" "$UPSTREAM_TS" "$UPSTREAM_SHA"
            printf -- '- Automated master-snapshot sync to upstream DiscImageCreator commit\n'
            printf '  %s (committed %s UTC); Release reset to 1.\n' "$UPSTREAM_SHA" "$UPSTREAM_TS"
            printf '\n'
          } > "$CL_ENTRY"
          sed -i "/^%changelog/r $CL_ENTRY" "$SPEC"
          rm -f "$CL_ENTRY"

          # --- Debian/Ubuntu recipe: advance it in lockstep. It is built on OBS,
          # from the same upstream Source: URLs the spec names. ---
          UB=ubuntu/discimagecreator
          echo "$UPSTREAM_SHA_FULL" > "$UB/.upstream-tag"
          bash scripts/deb/bump-changelog.sh "$UB" "${UPSTREAM_TS}.${UPSTREAM_SHA}" \
            "Automated master-snapshot sync to upstream DiscImageCreator commit ${UPSTREAM_SHA} (committed ${UPSTREAM_TS} UTC)."

          # --- openSUSE/OBS lane: advance the recipe in lockstep as well, so all
          # three lanes describe the same upstream commit in one git commit. This
          # OBS pulls the recipe from main itself, so nothing is uploaded here; the
          # `obs` job below just asks it to re-run its source services. ---
          bash scripts/opensuse-bump.sh discimagecreator "${UPSTREAM_TS}.${UPSTREAM_SHA}" "$UPSTREAM_SHA_FULL" \
            "Automated master-snapshot sync to upstream DiscImageCreator commit ${UPSTREAM_SHA} (committed ${UPSTREAM_TS} UTC)." \
            dicsnap="${UPSTREAM_TS}.${UPSTREAM_SHA}" diccommit="$UPSTREAM_SHA_FULL"

          # The .dsc carries the version AND the upstream archive names
          # (redumper-b732-... becomes -b733-...). Regenerate it here or OBS
          # keeps building the previous release, green and wrong.
          # rpmspec: gen-deb.sh reads the upstream Source: URLs out of the spec,
          # so the .dsc names exactly what download_files fetches.
          command -v rpmspec >/dev/null || sudo apt-get install -y -qq rpm >/dev/null
          bash scripts/obs/gen-deb.sh discimagecreator
          git add opensuse/discimagecreator/discimagecreator.dsc opensuse/discimagecreator/debian.tar.gz opensuse/discimagecreator/_service
          git add "$SPEC" "$MARKER" "$UB/.upstream-tag" "$UB/debian/changelog" \
                  opensuse/discimagecreator/discimagecreator.spec \
                  opensuse/discimagecreator/.upstream-tag
          if git diff --cached --quiet; then
            echo "Spec and marker unchanged after rewrite — exiting clean"
            exit 0
          fi

          # Signal the obs job (below) that there is a new revision to build.
          echo "changed=true" >> "$GITHUB_OUTPUT"

          git config user.name "rolling-watcher"
          git config user.email "actions@github.com"
          git commit -m "chore: discimagecreator master ${UPSTREAM_SHA} @ ${UPSTREAM_TS}"
          # Trigger branch = main's tree + a short, branch-specific landing
          # README (purely cosmetic: a distinct view per branch when browsing
          # GitHub). That one-file diff means build-dic is no longer a
          # fast-forward of main, so we recreate it and force-push — harmless,
          # since trigger refs are disposable and nobody branches off them.
          # Fires ONLY the discimagecreator job; other tools keep their
          # NEVRA; main stays canonical and builds nothing.
          # Manual single build:  scripts/build-tool.sh dic  (Weg B+ guard
          # auto-bumps Release; never hand-push main:build-dic unguarded)
          # main can move under us: another watcher, or a human pushing while this
          # run was in flight. On 2026-07-13 that killed the mpf watcher outright
          # ("! [rejected] ... (fetch first)") and the version bump then sat
          # unpublished until the next scheduled run -- silently, because a red
          # watcher looks like every other red run nobody reads. Rebase onto the
          # new tip and retry instead. Same shape as the dput retry in
          # obs-trigger.yml: try, fix the cause, try again, and fail LOUDLY only
          # if it still will not go.
          pushed=
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then pushed=1; break; fi
            echo "::warning::push to main rejected (attempt $attempt) -- rebasing onto the new tip"
            git fetch -q origin main
            git rebase origin/main
          done
          [ -n "$pushed" ] || { echo "::error::could not push to main after 3 attempts"; exit 1; }
          git checkout -q -b trigger-tmp
          printf '# build-dic — DiscImageCreator (Fedora/COPR trigger branch)\n\nAuto-managed **trigger branch** for the `discimagecreator` package: a push\nhere fires its COPR build via Packit, nothing else rebuilds. Canonical\nsource is `main` (do not edit here). Packaging: `fedora/discimagecreator/`.\n' > README.md
          git add README.md
          git commit -q -m "trigger: discimagecreator build (branch landing README)"
          git push -f origin trigger-tmp:build-dic


  # Tell OBS to re-pull the recipe from main and rebuild what actually changed.
  # OBS fetches the recipe itself, so there is nothing to upload — this only asks
  # it to re-run the source services. See .github/workflows/obs-trigger.yml.
  obs:
    needs: watch
    if: needs.watch.outputs.changed == 'true'
    uses: ./.github/workflows/obs-trigger.yml
    secrets: inherit
