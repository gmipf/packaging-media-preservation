name: watch-mpf-rolling

on:
  schedule:
    - cron: '52 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.sync.outputs.changed }}
    steps:
      - uses: actions/checkout@v5

      - name: Sync mpf spec with upstream rolling release
        id: sync
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          SPEC=fedora/mpf/mpf.spec
          MARKER=fedora/mpf/.rolling-sha

          UPSTREAM_SHA_FULL=$(gh api repos/SabreTools/MPF/git/refs/tags/rolling --jq '.object.sha')
          LOCAL_SHA=$(cat "$MARKER" 2>/dev/null || echo none)

          if [ "$UPSTREAM_SHA_FULL" = "$LOCAL_SHA" ]; then
            echo "Rolling SHA unchanged ($LOCAL_SHA) — no rebuild needed"
            exit 0
          fi

          # Held by hand: while fedora/mpf/.hold exists, no new MPF build is
          # packaged, whatever it contains. A check on one known defect lets go
          # as soon as that one spot changes, and on 2026-10-13 MPF master had
          # more than one thing broken at once; so the user decided to hold mpf
          # until MPF master is done ("fest bis Freigabe"). Releasing = deleting
          # the file. Red while held, so a forgotten hold cannot go quiet.
          # full-automation-exception: mpf/hold — while fedora/mpf/.hold exists no MPF build is packaged; releasing it is the user's call once MPF master is done (user, 2026-10-13: "fest bis Freigabe", after MPF 377de1d0 broke every dump while more repairs were in progress). Idle since the release that evening at c97cda44: no .hold exists, the step is kept for the next time
          if [ -s fedora/mpf/.hold ]; then
            echo "::error::mpf is held at ${LOCAL_SHA:0:8} on purpose and was NOT moved to ${UPSTREAM_SHA_FULL:0:8}: $(head -1 fedora/mpf/.hold) Released by a human: delete fedora/mpf/.hold once MPF master is done."
            exit 1
          fi

          UPSTREAM_SHA=${UPSTREAM_SHA_FULL:0:8}
          UPSTREAM_TS=$(gh api repos/SabreTools/MPF/releases/tags/rolling --jq '.published_at' | tr -d -- '-:TZ' | head -c 14)

          # All three csproj files (MPF.Check, MPF.CLI, MPF.Avalonia) carry
          # the same <VersionPrefix>. Reading just one is enough.
          UPSTREAM_VERSION=$(curl -fsSL "https://raw.githubusercontent.com/SabreTools/MPF/${UPSTREAM_SHA_FULL}/MPF.Check/MPF.Check.csproj" \
                             | grep -oP '(?<=<VersionPrefix>)[^<]+' | head -1)

          if [ -z "$UPSTREAM_VERSION" ]; then
            echo "Failed to extract VersionPrefix from csproj"
            exit 1
          fi

          echo "Upstream: version=$UPSTREAM_VERSION sha=$UPSTREAM_SHA ts=$UPSTREAM_TS"

          # A known-bad upstream build is not packaged (2026-10-13). MPF 377de1d0
          # ("Report exit codes from internal program execution") closes the
          # process and THEN reads its exit code, so every dump ends in
          # InvalidOperationException: CLI crash, GUI "An exception occurred!"
          # (measured by Boot 6.1 on Fedora 44, Windows 11 and the Avalonia GUI).
          # While the candidate has that form, mpf stays at the commit we ship;
          # once upstream changes the code it resumes by itself. Red while held:
          # the package is behind upstream on purpose, and a hold nobody sees can
          # outlive its reason. Matched on the shape (any variable, whitespace
          # removed), not on one spelling; an unreadable file is not a pass.
          # Behind the hand hold above this stays as a second layer: a release
          # while this form is still in the candidate still does not ship it.
          CTX_URL="https://raw.githubusercontent.com/SabreTools/MPF/${UPSTREAM_SHA_FULL}/MPF.ExecutionContexts/BaseExecutionContext.cs"
          CTX=$(curl -fsSL "$CTX_URL") || { echo "::error::Could not read $CTX_URL -- not packaging an unchecked MPF build; mpf stays at ${LOCAL_SHA:0:8}."; exit 1; }
          FLAT=${CTX//[[:space:]]/}
          CLOSE_THEN_EXIT='\.Close\(\);return[A-Za-z_][A-Za-z0-9_]*\.ExitCode;'
          if [[ $FLAT =~ $CLOSE_THEN_EXIT ]]; then
            echo "::error::MPF ${UPSTREAM_SHA} closes the process before reading its exit code (regression from 377de1d0: every dump ends in InvalidOperationException). Not packaged; mpf stays at ${LOCAL_SHA:0:8} and resumes by itself once upstream changes it."
            exit 1
          fi

          echo "$UPSTREAM_SHA_FULL" > "$MARKER"

          # Tilde-style rolling snapshot lives in two %global lines in the
          # spec. Rewrite both (%global mpfver -> base, %global mpfsnap ->
          # <UTC-TS>.<short-SHA>) and reset Release to 1: a new snapshot is a
          # fresh identity, so the packaging-iteration counter starts over.
          # RPM sorts on Version first, so -1 still supersedes the previous
          # snapshot's -N.
          sed -i "s/^%global mpfver .*/%global mpfver         ${UPSTREAM_VERSION}/"           "$SPEC"
          sed -i "s/^%global mpfsnap .*/%global mpfsnap        ${UPSTREAM_TS}.${UPSTREAM_SHA}/" "$SPEC"
          sed -i "s/^Release:.*/Release:        1%{?dist}/"                                     "$SPEC"

          # Prepend a %changelog entry for the new snapshot. EVR is written
          # without %{?dist} to match the existing hand-written entries.
          CL_ENTRY=$(mktemp)
          {
            printf '* %s gmipf <gmipf64@gmail.com> - %s~%s.%s-1\n' \
              "$(LC_ALL=C date -u +'%a %b %d %Y')" "$UPSTREAM_VERSION" "$UPSTREAM_TS" "$UPSTREAM_SHA"
            printf -- '- Automated rolling-snapshot sync to upstream MPF commit %s\n' "$UPSTREAM_SHA"
            printf '  (rolling tag, published %s UTC); Release reset to 1.\n' "$UPSTREAM_TS"
            printf '\n'
          } > "$CL_ENTRY"
          sed -i "/^%changelog/r $CL_ENTRY" "$SPEC"
          rm -f "$CL_ENTRY"

          # --- Debian/Ubuntu recipe: advance it in lockstep. It is built on OBS,
          # from the same upstream Source: URLs the spec names. ---
          UB=ubuntu/mpf
          bash scripts/deb/bump-changelog.sh "$UB" "${UPSTREAM_VERSION}~${UPSTREAM_TS}.${UPSTREAM_SHA}" \
            "Automated rolling-snapshot sync to upstream MPF commit ${UPSTREAM_SHA} (published ${UPSTREAM_TS} UTC)."

          # --- openSUSE/OBS lane: advance the recipe in lockstep as well, so all
          # three lanes describe the same upstream snapshot in one commit. The
          # openSUSE marker is the constant `rolling` tag (like ubuntu's), so it
          # is left alone ("-") — only the two version macros move. OBS pulls the
          # recipe from main itself, so nothing is uploaded here; the `obs` job
          # below just asks it to re-run its source services. ---
          bash scripts/opensuse-bump.sh mpf "${UPSTREAM_VERSION}~${UPSTREAM_TS}.${UPSTREAM_SHA}" - \
            "Automated rolling-snapshot sync to upstream MPF commit ${UPSTREAM_SHA} (published ${UPSTREAM_TS} UTC)." \
            mpfver="$UPSTREAM_VERSION" mpfsnap="${UPSTREAM_TS}.${UPSTREAM_SHA}"

          # The .dsc carries the version AND the upstream archive names
          # (redumper-b732-... becomes -b733-...). Regenerate it here or OBS
          # keeps building the previous release, green and wrong.
          # rpmspec: gen-deb.sh reads the upstream Source: URLs out of the spec,
          # so the .dsc names exactly what download_files fetches.
          command -v rpmspec >/dev/null || sudo apt-get install -y -qq rpm >/dev/null
          bash scripts/obs/gen-deb.sh mpf
          git add opensuse/mpf/mpf.dsc opensuse/mpf/debian.tar.gz opensuse/mpf/_service
          git add "$SPEC" "$MARKER" "$UB/debian/changelog" opensuse/mpf/mpf.spec
          if git diff --cached --quiet; then
            echo "Spec and marker unchanged after rewrite — exiting clean"
            exit 0
          fi

          # Signal the obs job (below) that there is a new revision to build.
          echo "changed=true" >> "$GITHUB_OUTPUT"

          git config user.name "rolling-watcher"
          git config user.email "actions@github.com"
          git commit -m "chore: mpf ${UPSTREAM_VERSION} rolling ${UPSTREAM_SHA} @ ${UPSTREAM_TS}"
          # Trigger branch = main's tree + a short, branch-specific landing
          # README (purely cosmetic: a distinct view per branch when browsing
          # GitHub). That one-file diff means build-mpf is no longer a
          # fast-forward of main, so we recreate it and force-push — harmless,
          # since trigger refs are disposable and nobody branches off them.
          # Fires ONLY the mpf job; other tools keep their NEVRA; main stays
          # canonical and builds nothing (no job watches main).
          # Manual single build:  scripts/build-tool.sh mpf  (Weg B+ guard
          # auto-bumps Release; never hand-push main:build-mpf unguarded)
          # main can move under us: another watcher, or a human pushing while this
          # run was in flight. On 2026-07-13 that killed the mpf watcher outright
          # ("! [rejected] ... (fetch first)") and the version bump then sat
          # unpublished until the next scheduled run -- silently, because a red
          # watcher looks like every other red run nobody reads. Rebase onto the
          # new tip and retry instead. Same shape as the dput retry in
          # obs-trigger.yml: try, fix the cause, try again, and fail LOUDLY only
          # if it still will not go.
          pushed=
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then pushed=1; break; fi
            echo "::warning::push to main rejected (attempt $attempt) -- rebasing onto the new tip"
            git fetch -q origin main
            git rebase origin/main
          done
          [ -n "$pushed" ] || { echo "::error::could not push to main after 3 attempts"; exit 1; }
          git checkout -q -b trigger-tmp
          # shellcheck disable=SC2016  # the backticks are Markdown, meant literally
          printf '# build-mpf — MPF (Fedora/COPR trigger branch)\n\nAuto-managed **trigger branch** for the `mpf` package: a push here fires\nthe mpf COPR build via Packit, nothing else rebuilds. Canonical source is\n`main` (do not edit here). Packaging: `fedora/mpf/`.\n' > README.md
          git add README.md
          git commit -q -m "trigger: mpf build (branch landing README)"
          bash scripts/push-retry.sh -f origin trigger-tmp:build-mpf || echo "trigger_failed=1" >> "$GITHUB_OUTPUT"

      # The version is on main and OBS is refreshed regardless (the obs job runs
      # `always()`), but a COPR trigger branch could not be pushed even after
      # retries. That build is late, not lost: copr-reconcile.yml compares every
      # spec on main with COPR every six hours and re-pushes the trigger of a
      # version COPR never got -- and goes red itself if that does not help.
      # Nothing here needs a person, so this run stays green: a red mail that
      # asks for nothing only teaches its reader to skip red mails.
      - name: Note a COPR trigger that copr-reconcile will catch up
        if: steps.sync.outputs.trigger_failed == '1'
        run: |
          echo "::warning::A COPR trigger branch could not be pushed after retries (see the step above). The version is on main and OBS was asked to refresh; copr-reconcile.yml re-pushes the trigger within six hours."

      # MPF-DREAMDUMP-PATH-WORKAROUND guard (2026-10-13; both directions since the
      # workaround came out the same evening). MPF's CLI stored the resolved
      # Dreamdump path in AaruPath (MPF.CLI/Features/BaseFeature.cs, since
      # 9909f44e), so a bare DreamdumpPath failed with "does not exist" (measured
      # in test-fedora); the wrappers seeded /usr/bin/dreamdump until MPF shipped
      # the fix (SabreTools/MPF#1043, in c97cda44). A workaround for someone
      # else's bug expires when THEY fix it -- and comes back if they break it
      # again. So on every run, in exactly the MPF commit we ship:
      # - workaround in the wrappers: red once the broken form is gone (due out);
      # - no workaround: red once the broken form is back (a bare name fails
      #   again; e219926 is the template to restore it).
      # Red as well when the file cannot be read or has no Dreamdump branch: a
      # check that cannot see is not a pass. It never edits the wrappers itself:
      # a rewrite of that code can look like a fix or like a regression, so a
      # session reads the change first, then checks mpf-cli -u dreamdump.
      # full-automation-exception: mpf/dreamdump-path-workaround — adding or removing the DreamdumpPath workaround for MPF's CLI bug is done by a session after reading upstream's change, because a check on upstream's spelling can mistake a rewrite for a fix or a regression; this step only detects that it is due (user, 2026-10-13: "nachdem der fix drin ist, entfernst du den umweg wieder"; removed that evening: "dreamdump ist doch gefixt, entferne den umweg wieder")
      - name: Does MPF's Dreamdump path handling match our wrappers?
        run: |
          set -euo pipefail
          files=(fedora/mpf/mpf.spec opensuse/mpf/mpf.spec ubuntu/mpf/debian/mpf-wrapper.in)
          marked=$(grep -l 'MPF-DREAMDUMP-PATH-WORKAROUND' "${files[@]}" || true)
          if [ -n "$marked" ]; then have=with; else have=without; fi
          sha=$(cat fedora/mpf/.rolling-sha)
          url="https://raw.githubusercontent.com/SabreTools/MPF/${sha}/MPF.CLI/Features/BaseFeature.cs"
          src=$(curl -fsSL "$url") || { echo "::error::Could not read $url -- whether MPF's CLI matches our DreamdumpPath seed was NOT checked."; exit 1; }
          state=$(awk '/case InternalProgram\.Dreamdump:/ {f=1; seen=1; next}
                       f && /case InternalProgram\.|default:/ {f=0}
                       f && /Dumping\.AaruPath[[:space:]]*=/ {bad=1}
                       END {print (!seen ? "no-branch" : (bad ? "broken" : "fixed"))}' <<<"$src")
          case "$state/$have" in
            broken/with)
              echo "MPF ${sha:0:8} still stores Dreamdump's resolved path in AaruPath -- the workaround stays." ;;
            fixed/without)
              echo "MPF ${sha:0:8} no longer stores Dreamdump's resolved path in AaruPath -- the bare seed needs no workaround." ;;
            fixed/with)
              echo "::error::MPF ${sha:0:8} no longer stores Dreamdump's resolved path in AaruPath. The DreamdumpPath workaround is obsolete: remove both MPF-DREAMDUMP-PATH-WORKAROUND blocks in ${marked//$'\n'/ }, then check mpf-cli -u dreamdump with the bare name."
              exit 1 ;;
            broken/without)
              echo "::error::MPF ${sha:0:8} stores Dreamdump's resolved path in AaruPath again, so mpf-cli cannot find the bare DreamdumpPath our wrappers seed (\"does not exist\"). Read the change, then restore the DreamdumpPath workaround in all three wrappers (e219926 is the template: absolute seed plus migration of the bare one)."
              exit 1 ;;
            *)
              echo "::error::MPF ${sha:0:8} has no 'case InternalProgram.Dreamdump:' in MPF.CLI/Features/BaseFeature.cs any more, so this check cannot judge whether our DreamdumpPath seed still works. Read the change."
              exit 1 ;;
          esac

  # Tell OBS to re-pull the recipe from main and rebuild what actually changed.
  # OBS fetches the recipe itself, so there is nothing to upload — this only asks
  # it to re-run the source services. See .github/workflows/obs-trigger.yml.
  obs:
    needs: watch
    # always(): OBS must not be skipped because the COPR trigger failed.
    if: always() && needs.watch.outputs.changed == 'true'
    uses: ./.github/workflows/obs-trigger.yml
    secrets: inherit
