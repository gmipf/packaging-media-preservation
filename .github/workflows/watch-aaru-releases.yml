name: watch-aaru-releases

# Aaru is on the v6.0.0 alpha track — upstream publishes a new alpha
# tag every 2–6 weeks. We poll hourly, pick the highest `alpha.<N>` tag
# (including sub-revisions like `alpha.15.1`), and rewrite the
# `%global aaruprerel` line in the spec. Source0/Source1 URLs are
# deterministic from the tag, so no body-parse or asset lookup needed.
#
# Loud-fail conditions (manual review required — tilde-versioning and
# Epoch strategy in the spec assume alpha-only):
#   * stable v6.0.0 (no -alpha)
#   * v6.0.0-beta.* or v6.0.0-rc.*
#   * v7.* or higher major
# When any of these appear among recent releases, the workflow exits
# nonzero so the cron run is visibly broken in the Actions UI.

on:
  schedule:
    - cron: '22 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.sync.outputs.changed }}
    steps:
      - uses: actions/checkout@v5

      - name: Sync aaru spec with upstream alpha release
        id: sync
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          SPEC=fedora/aaru/aaru.spec
          MARKER=fedora/aaru/.upstream-tag

          # Detect any tag that signals upstream has left the alpha track.
          TRANSITION=$(gh api 'repos/aaru-dps/Aaru/releases?per_page=20' --jq '
            [.[] | select(.draft == false) | .tag_name
                 | select(test("^v(6\\.0\\.0$|6\\.0\\.0-(beta|rc)|[7-9]\\.)"))]
            | .[]
          ')
          if [ -n "$TRANSITION" ]; then
            echo "::error::Aaru moved past the alpha track — manual spec review required"
            echo "Transitional tags detected:"
            echo "$TRANSITION"
            exit 1
          fi

          # Pick the highest v6.0.0-alpha.<N>[.<M>] tag by numeric sort
          # of each dot-separated component after `alpha.`.
          UPSTREAM_TAG=$(gh api 'repos/aaru-dps/Aaru/releases?per_page=20' --jq '
            [.[] | select(.draft == false
                          and (.tag_name | test("^v6\\.0\\.0-alpha\\.[0-9]+(\\.[0-9]+)?$")))
                 | .tag_name]
            | sort_by([. | sub("^v6\\.0\\.0-alpha\\."; "") | split(".") | map(tonumber)])
            | last
          ')

          if [ -z "$UPSTREAM_TAG" ] || [ "$UPSTREAM_TAG" = "null" ]; then
            echo "::error::No matching v6.0.0-alpha.<N> tag found in recent releases"
            exit 1
          fi

          LOCAL_TAG=$(cat "$MARKER" 2>/dev/null || echo none)

          if [ "$UPSTREAM_TAG" = "$LOCAL_TAG" ]; then
            echo "Tag unchanged ($LOCAL_TAG) — no rebuild needed"
            exit 0
          fi

          echo "Upstream tag changed: $LOCAL_TAG -> $UPSTREAM_TAG"

          # Strip `v6.0.0-` prefix to get the prerel value the spec wants
          # (e.g. `alpha.19` or `alpha.15.1`).
          PRERELEASE=${UPSTREAM_TAG#v6.0.0-}

          echo "$UPSTREAM_TAG" > "$MARKER"
          sed -i "s|^%global aaruprerel .*|%global aaruprerel    ${PRERELEASE}|" "$SPEC"

          # New upstream prerelease = fresh identity, so reset the
          # packaging-iteration counter and prepend a %changelog entry.
          # aaruver (the base version) is read back from the spec so the
          # EVR matches Version = %{aaruver}~%{aaruprerel}. LC_ALL=C for an
          # English date; EVR without %{?dist} to match existing entries.
          AARUVER=$(grep -oP '^%global aaruver\s+\K\S+' "$SPEC")
          sed -i "s/^Release:.*/Release:        1%{?dist}/" "$SPEC"
          CL_ENTRY=$(mktemp)
          {
            printf '* %s gmipf <gmipf64@gmail.com> - %s~%s-1\n' \
              "$(LC_ALL=C date -u +'%a %b %d %Y')" "$AARUVER" "$PRERELEASE"
            printf -- '- Automated sync to upstream Aaru %s; Release reset to 1.\n' "$UPSTREAM_TAG"
            printf '\n'
          } > "$CL_ENTRY"
          sed -i "/^%changelog/r $CL_ENTRY" "$SPEC"
          rm -f "$CL_ENTRY"

          # --- Ubuntu PPA lane: advance the ubuntu recipe in lockstep. Debian
          # tilde version mirrors the RPM's Version = %{aaruver}~%{aaruprerel}
          # (e.g. 6.0.0~alpha.19); the marker keeps the full upstream tag. ---
          UB=ubuntu/aaru
          echo "$UPSTREAM_TAG" > "$UB/.upstream-tag"
          bash scripts/deb/ppa-bump-changelog.sh "$UB" "${AARUVER}~${PRERELEASE}" \
            "Automated sync to upstream Aaru ${UPSTREAM_TAG}."

          # --- openSUSE/OBS lane: advance the recipe in lockstep as well, so all
          # three lanes describe the same upstream tag in one commit. Only
          # aaruprerel moves (aaruver stays the 6.0.0 base, as in fedora). This
          # OBS pulls the recipe from main itself, so nothing is uploaded here; the
          # `obs` job below just asks it to re-run its source services. ---
          bash scripts/opensuse-bump.sh aaru "${AARUVER}~${PRERELEASE}" "$UPSTREAM_TAG" \
            "Automated sync to upstream Aaru ${UPSTREAM_TAG}." \
            aaruprerel="$PRERELEASE"

          git add "$SPEC" "$MARKER" "$UB/.upstream-tag" "$UB/debian/changelog" \
                  opensuse/aaru/aaru.spec opensuse/aaru/.upstream-tag
          if git diff --cached --quiet; then
            echo "Spec and marker unchanged after rewrite — exiting clean"
            exit 0
          fi

          # Signal the ppa job (below) that there is a new revision to upload.
          echo "changed=true" >> "$GITHUB_OUTPUT"

          git config user.name "rolling-watcher"
          git config user.email "actions@github.com"
          git commit -m "chore: aaru ${UPSTREAM_TAG}"
          # Trigger branch = main's tree + a short, branch-specific landing
          # README (purely cosmetic: a distinct view per branch when browsing
          # GitHub). That one-file diff means build-aaru is no longer a
          # fast-forward of main, so we recreate it and force-push — harmless,
          # since trigger refs are disposable and nobody branches off them.
          # Fires ONLY the aaru job; other tools keep their NEVRA; main stays
          # canonical and builds nothing.
          # Manual single build:  scripts/build-tool.sh aaru  (Weg B+ guard
          # auto-bumps Release; never hand-push main:build-aaru unguarded)
          # main can move under us: another watcher, or a human pushing while this
          # run was in flight. On 2026-07-13 that killed the mpf watcher outright
          # ("! [rejected] ... (fetch first)") and the version bump then sat
          # unpublished until the next scheduled run -- silently, because a red
          # watcher looks like every other red run nobody reads. Rebase onto the
          # new tip and retry instead. Same shape as the dput retry in
          # ppa-upload.yml: try, fix the cause, try again, and fail LOUDLY only
          # if it still will not go.
          pushed=
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then pushed=1; break; fi
            echo "::warning::push to main rejected (attempt $attempt) -- rebasing onto the new tip"
            git fetch -q origin main
            git rebase origin/main
          done
          [ -n "$pushed" ] || { echo "::error::could not push to main after 3 attempts"; exit 1; }
          git checkout -q -b trigger-tmp
          printf '# build-aaru — Aaru (Fedora/COPR trigger branch)\n\nAuto-managed **trigger branch** for the `aaru` package: a push here fires\nthe aaru COPR build via Packit, nothing else rebuilds. Canonical source is\n`main` (do not edit here). Packaging: `fedora/aaru/`.\n' > README.md
          git add README.md
          git commit -q -m "trigger: aaru build (branch landing README)"
          git push -f origin trigger-tmp:build-aaru

  # Upload the same revision to the Launchpad PPA (noble + jammy). Runs only
  # when the sync above committed a change; skips gracefully if the signing
  # secret is unset. See .github/workflows/ppa-upload.yml.
  ppa:
    needs: watch
    if: needs.watch.outputs.changed == 'true'
    uses: ./.github/workflows/ppa-upload.yml
    with:
      tool: aaru
    secrets: inherit

  # Tell OBS to re-pull the recipe from main and rebuild what actually changed.
  # OBS fetches the recipe itself, so there is nothing to upload — this only asks
  # it to re-run the source services. See .github/workflows/obs-trigger.yml.
  obs:
    needs: watch
    if: needs.watch.outputs.changed == 'true'
    uses: ./.github/workflows/obs-trigger.yml
    secrets: inherit
