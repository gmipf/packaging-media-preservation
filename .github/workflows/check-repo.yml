name: check-repo

# The offline checks, on every push -- because until 2026-07-22 NOTHING here ran
# them. `scripts/status.sh` is a human "sync" tool: you have to remember to type
# it. `scripts/proof-status.sh` is wired in as a git hook, and a hook lives in the
# CLONE (`git config core.hooksPath .githooks`, once per clone) -- so a push from
# a fresh clone, or from a machine where that config was never set, sails past it.
#
# ⭐ A check nobody starts is not a channel. That is the same finding that got the
# ::warning:: thrown out of watch-redumper-gui.yml on 2026-07-20, one level up: a
# report with no delivery is a report nobody reads.
#
# What runs here is what is decidable from the checkout alone. The farms have
# their own scheduled workflows: copr-reconcile.yml (COPR behind main or failed)
# and obs-health.yml (an OBS target failed, or OBS behind main). The sentence
# that stood here until 2026-10-13 -- "the OBS API is not readable anonymously,
# so this CANNOT run in CI" -- was true only for the authenticated API; OBS
# serves the same reads under /public without a login. Still a "sync" step at
# the keyboard: status.sh's other blocks (_service URLs, MPF bundle pins, the
# full-automation scan, the workflow-run summary).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # The one number rpm and dpkg cannot deduplicate: the Rust floor is a
      # literal in FOUR places (fedora spec, opensuse spec, and twice in
      # debian/control). Until today status.sh guarded exactly one of them, and
      # nothing wrote any of them. Both halves are fixed; this is the guard.
      - name: Rust floor — every declaration against rust-targets.tsv
        run: bash scripts/msrv-sync.sh --check

      # Exits 1 on drift or on a mechanism fragment with no ledger row. Runs as a
      # pre-commit hook too; this is the copy that does not depend on a clone
      # having been configured.
      - name: Proof ledger — drift and coverage
        run: bash scripts/proof-status.sh

      # A generator the Debian lane must carry as a COPY (it cannot fetch by URL)
      # has to stay byte-identical to the Fedora one, or one lane quietly runs an
      # older guard. Only the generator SCRIPTS: the manpage templates (*.1.in)
      # differ on purpose (Debian installs to /usr/lib, uses a symlink, keeps the
      # license under /usr/share/doc).
      - name: Shared generator scripts are identical across lanes
        run: |
          set -euo pipefail
          rc=0 n=0
          for f in fedora/*/*-build.sh fedora/*/*-manpage.sh; do
            [ -e "$f" ] || continue
            pkg=$(basename "$(dirname "$f")"); name=$(basename "$f")
            for c in "opensuse/$pkg/$name" "ubuntu/$pkg/debian/$name"; do
              [ -e "$c" ] || continue
              n=$((n + 1))
              if cmp -s "$f" "$c"; then echo "ok   $c"; else echo "::error::$c differs from $f"; rc=1; fi
            done
          done
          [ "$n" -gt 0 ] || { echo "::error::compared nothing -- the layout moved"; exit 1; }
          exit $rc

  # Every lint rule, through the script the pre-commit hook runs too
  # (scripts/lint.sh lists them: whitespace, shellcheck incl. shebang files,
  # xmllint, desktop-file-validate, yamllint, actionlint, packit validate). Here
  # every tool is installed, so a rule cannot be skipped. Fedora, because each
  # tool but actionlint comes from its own repositories -- the same versions as
  # on the maintainer's machine, packit included.
  lint:
    runs-on: ubuntu-latest
    container: registry.fedoraproject.org/fedora:latest
    steps:
      # Hard dependencies only, and no Cisco repository. With weak dependencies
      # this pulled 680 packages (podman, qemu, skopeo... recommended by packit),
      # and on 2026-10-13 the run died because Cisco's CDN did not serve
      # openh264 -- a codec none of these linters uses. Every extra package is
      # one more mirror that can fail the lint before it starts.
      - name: Install the linters
        run: >-
          dnf -y -q --setopt=install_weak_deps=False --disablerepo=fedora-cisco-openh264
          install git-core tar gzip /usr/bin/dpkg-parsechangelog /usr/bin/shellcheck
          /usr/bin/xmllint /usr/bin/desktop-file-validate /usr/bin/yamllint /usr/bin/packit
          /usr/bin/rpmlint /usr/bin/groff rpm-build systemd-rpm-macros

      # Not packaged for Fedora. The release binary, pinned by version AND by
      # checksum -- the hash below was read from a download verified against the
      # release's checksums file on 2026-10-13, so this does not trust a file
      # fetched from the same place as the binary.
      - name: Install actionlint
        env:
          V: 1.7.12
          SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/actionlint.tgz "https://github.com/rhysd/actionlint/releases/download/v${V}/actionlint_${V}_linux_amd64.tar.gz"
          echo "${SHA256}  /tmp/actionlint.tgz" | sha256sum -c -
          tar xzf /tmp/actionlint.tgz -C /usr/local/bin actionlint
          actionlint -version

      - uses: actions/checkout@v5

      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: scripts/lint.sh
        run: bash scripts/lint.sh
