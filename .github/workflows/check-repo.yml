name: check-repo

# The offline checks, on every push -- because until 2026-07-22 NOTHING here ran
# them. `scripts/status.sh` is a human "sync" tool: you have to remember to type
# it. `scripts/proof-status.sh` is wired in as a git hook, and a hook lives in the
# CLONE (`git config core.hooksPath .githooks`, once per clone) -- so a push from
# a fresh clone, or from a machine where that config was never set, sails past it.
#
# ⭐ A check nobody starts is not a channel. That is the same finding that got the
# ::warning:: thrown out of watch-redumper-gui.yml on 2026-07-20, one level up: a
# report with no delivery is a report nobody reads.
#
# ⚠️ HONEST LIMIT, so nobody reads this as "the repository is checked in CI":
# status.sh's other blocks need COPR, OBS and GitHub. The OBS API is not readable
# anonymously (401 even for a public project), so they CANNOT run here, and this
# workflow deliberately does not pretend to. What runs here is what is decidable
# from the checkout alone. The rest stays a "sync" step at the keyboard.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # The one number rpm and dpkg cannot deduplicate: the Rust floor is a
      # literal in FOUR places (fedora spec, opensuse spec, and twice in
      # debian/control). Until today status.sh guarded exactly one of them, and
      # nothing wrote any of them. Both halves are fixed; this is the guard.
      - name: Rust floor — every declaration against rust-targets.tsv
        run: bash scripts/msrv-sync.sh --check

      # Exits 1 on drift or on a mechanism fragment with no ledger row. Runs as a
      # pre-commit hook too; this is the copy that does not depend on a clone
      # having been configured.
      - name: Proof ledger — drift and coverage
        run: bash scripts/proof-status.sh

      # Every shell script in the repo, at warning level. Added 2026-10-12, when it
      # found exactly one thing (an unused variable, three copies) -- so the bar
      # starts clean and stays clean. Nothing linted these before, in CI or out.
      - name: shellcheck — every tracked *.sh
        run: |
          set -euo pipefail
          files=$(git ls-files '*.sh')
          [ -n "$files" ] || { echo "::error::no *.sh found -- the check would pass on nothing"; exit 1; }
          echo "$files" | xargs shellcheck -S warning -f gcc
          echo "shellcheck: $(echo "$files" | wc -l) scripts clean"

      # A generator the Debian lane must carry as a COPY (it cannot fetch by URL)
      # has to stay byte-identical to the Fedora one, or one lane quietly runs an
      # older guard. Only the generator SCRIPTS: the manpage templates (*.1.in)
      # differ on purpose (Debian installs to /usr/lib, uses a symlink, keeps the
      # license under /usr/share/doc).
      - name: Shared generator scripts are identical across lanes
        run: |
          set -euo pipefail
          rc=0 n=0
          for f in fedora/*/*-build.sh fedora/*/*-manpage.sh; do
            [ -e "$f" ] || continue
            pkg=$(basename "$(dirname "$f")"); name=$(basename "$f")
            for c in "opensuse/$pkg/$name" "ubuntu/$pkg/debian/$name"; do
              [ -e "$c" ] || continue
              n=$((n + 1))
              if cmp -s "$f" "$c"; then echo "ok   $c"; else echo "::error::$c differs from $f"; rc=1; fi
            done
          done
          [ "$n" -gt 0 ] || { echo "::error::compared nothing -- the layout moved"; exit 1; }
          exit $rc
