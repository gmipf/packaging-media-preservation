name: obs-trigger

# Refresh the openSUSE/OBS packages after a recipe change on main.
#
# How this lane works: OBS pulls the recipe itself. Each `opensuse/<tool>/_service`
# fetches the spec, manpages, udev rule and icons from raw.githubusercontent at
# `main` (download_url), and `download_files` then reads that generated spec and
# downloads the upstream assets from its Source: URLs. So git is the single source
# of truth and nothing has to be uploaded to OBS.
#
# All this workflow does is tell OBS to re-run those services. OBS creates a new
# source revision — and therefore a rebuild — ONLY if the generated sources really
# changed: the rebuild-relevant hash (verifymd5) is content-based, so triggering a
# package whose recipe did not move is a free no-op (verified on a probe project).
# That is why we simply refresh EVERY package instead of routing per tool: it
# cannot cause a spurious rebuild, and no tool can be forgotten.
#
# The package list is READ FROM THE REPO (every opensuse/<tool>/ that has a
# _service), never hardcoded. It used to be a literal list of five names, and that
# is precisely how redumper-gui and redumper729 came to be missing from this lane
# for a week: a new package is added under opensuse/, everything looks green, and
# nothing anywhere says the trigger never learned about it. A list you have to
# remember to update is a list that will be wrong.
#
# Why a token and not `osc`: an OBS token can ONLY do the operation it was created
# for — here `runservice`. It cannot commit, upload or delete anything. The only
# credential that *could* commit is the account password, which is exactly what we
# do not want in CI. Hence the recipe is FETCHED by OBS rather than PUSHED to it.
#
# Setup (once):
#   osc token --create --operation runservice     # unbound: OBS rejects project-wide tokens
#   -> store the printed string as the repository secret OBS_TOKEN

# THE DEBIAN PACKAGES HAVE A PRECONDITION, AND IT IS TIMED
#
# Their .orig tarball is not fetched from upstream — it has to be ASSEMBLED (aaru
# merges two upstream tarballs, mpf three binaries) and no OBS source service can
# do that; OBS can only download. The PPA lane assembles it anyway, and Launchpad
# stores one immutable copy per upstream version, so `_service` points there.
#
# Which means a version can only be built on Debian once its orig is IN Launchpad.
# Trigger OBS before that and download_url gets a 404: the service run fails and
# the package silently keeps building the previous version. So we wait for exactly
# the URLs OBS is about to fetch — read out of `_service` itself, never guessed —
# and only then trigger. The upload lands in the librarian at ACCEPTANCE, well
# before Launchpad builds anything, so this is a wait of minutes, not hours.

on:
  workflow_call:
  workflow_dispatch:
  # Covers recipe edits pushed by a human. Watcher commits are made with the
  # default GITHUB_TOKEN, and GitHub deliberately does not start workflows from
  # those — which is why every watcher calls this workflow explicitly instead.
  push:
    branches: [main]
    paths:
      - 'opensuse/**'
      # The deb side of a package is generated from its Ubuntu recipe, so a
      # changelog bump under ubuntu/ moves opensuse/<tool>/{_service,*.dsc} too.
      - 'ubuntu/**'

permissions:
  contents: read

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Wait until Launchpad has the .orig tarballs OBS is about to fetch
        run: |
          set -euo pipefail

          # The URLs come out of _service, so this checks the very file OBS will
          # request. Deriving them here instead would let the two drift apart —
          # and a check that tests something else than the real thing is worse
          # than no check, because it reports green.
          urls=$(grep -ho 'https://launchpad\.net/[^<]*\.orig\.tar\.xz' \
                 opensuse/*/_service | sort -u)
          [ -n "$urls" ] || { echo "no Launchpad origs referenced — nothing to wait for"; exit 0; }

          missing="$urls"
          for attempt in $(seq 1 30); do          # 30 x 20s = 10 minutes
            still=
            for u in $missing; do
              code=$(curl -o /dev/null -sIL --max-time 30 -w '%{http_code}' "$u" || echo 000)
              [ "$code" = "200" ] || still="$still $u"
            done
            missing=$(echo $still)
            [ -n "$missing" ] || { echo ":: every orig is in Launchpad"; exit 0; }
            echo ":: waiting for $(echo $missing | wc -w) orig(s), attempt $attempt"
            sleep 20
          done

          # Loud, not silent: without the orig the deb build of these packages
          # would keep shipping the previous version and look perfectly green.
          echo "::error::Launchpad still has no orig for:"
          for u in $missing; do echo "  $u"; done
          echo "The PPA upload for this version has not been accepted yet, or it failed."
          exit 1

      - name: Ask OBS to re-run the source services
        env:
          OBS_TOKEN: ${{ secrets.OBS_TOKEN }}
          PROJECT: home:gmipf:media-preservation
        run: |
          set -euo pipefail

          if [ -z "${OBS_TOKEN:-}" ]; then
            echo "::warning::OBS_TOKEN is not set — skipping the OBS refresh."
            echo "Create one with: osc token --create --operation runservice"
            exit 0
          fi

          # Every opensuse/<tool>/ that carries a _service is a package on OBS.
          pkgs=$(find opensuse -mindepth 2 -maxdepth 2 -name _service \
                 -printf '%h\n' | xargs -r -n1 basename | sort)
          [ -n "$pkgs" ] || { echo "::error::no opensuse/*/_service found"; exit 1; }
          echo "Packages: $(echo $pkgs)"

          rc=0
          for pkg in $pkgs; do
            code=$(curl -sS -o /tmp/obs-trigger.out -w '%{http_code}' -X POST \
              -H "Authorization: Token $OBS_TOKEN" \
              "https://api.opensuse.org/trigger/runservice?project=${PROJECT}&package=${pkg}")

            if [ "$code" = "200" ]; then
              echo ":: $pkg — services re-run requested"
            else
              # Keep going: one broken package must not hide the others. The
              # response body carries OBS's reason (it never echoes the token).
              echo "::error::OBS refused the trigger for $pkg (HTTP $code)"
              cat /tmp/obs-trigger.out || true
              rc=1
            fi
          done
          exit $rc
