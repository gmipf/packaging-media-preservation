issue_repository: https://github.com/gmipf/packaging-media-preservation

srpm_build_deps:
  - rpm-build
  - rpmdevtools

# Multi-package layout — each tool gets its own block under packages:.
# When `paths:` is set, `specfile_path` and action-internal paths are
# relative to that path (Packit joins them: paths + specfile_path).
# create-archive overrides are needed because this repo holds only
# packaging recipes (no upstream source); default `git archive HEAD`
# would only archive the spec. We use spectool to fetch Source0 instead.
packages:
  redumper:
    paths:
      - fedora/redumper/
    specfile_path: redumper.spec
    upstream_project_url: https://github.com/superg/redumper
    upstream_tag_template: "b{version}"
    # Repackage of upstream prebuilt linux-x64 ZIP (since Phase 6).
    # spectool also fetches LICENSE + README via raw.githubusercontent.
    # create-archive returns the linux-x64.zip as the primary archive;
    # SRPM packs all three Source* URLs.
    actions:
      get-current-version:
        - bash -c "rpmspec -q --queryformat '%{version}\n' redumper.spec | head -1"
      create-archive:
        - bash -c "spectool -g redumper.spec 1>&2"
        - bash -c "ls -1 redumper-b*-linux-x64.zip | head -1"

  mpf:
    paths:
      - fedora/mpf/
    specfile_path: mpf.spec
    upstream_project_url: https://github.com/SabreTools/MPF
    # spectool -g fetches all three Source* zips (check + cli + gui); SRPM packs
    # them all. We return the Check zip as the primary archive because Packit
    # only needs one stdout line to anchor the archive set.
    actions:
      # MANDATORY. This block used to say "no get-current-version needed --
      # watch-mpf-rolling.yml rewrites %global mpfver, so rpmspec returns the
      # right version". That was a trap: Packit does not read the spec. With no
      # such action it derives the version from the newest GIT TAG in THIS repo.
      # For years there were none, so it silently fell back to something sane.
      # On 2026-07-13 `gh release create redumper-gui-1.0.1` (publishing the
      # vendored tarball) created the first tag ever -- and every package lacking
      # this action immediately started building as version `redumper.gui.1.0.1`.
      # mpf shipped as mpf-redumper.gui.1.0.1-2 (COPR 10713586). One tag poisons
      # every package that does not pin its version explicitly.
      get-current-version:
        - bash -c "rpmspec -q --queryformat '%{version}\n' mpf.spec | head -1"
      create-archive:
        - bash -c "spectool -g mpf.spec 1>&2"
        - bash -c "ls -1 MPF.Check_net10.0_linux-x64_release.zip"

  discimagecreator:
    paths:
      - fedora/discimagecreator/
    specfile_path: discimagecreator.spec
    upstream_project_url: https://github.com/saramibreak/DiscImageCreator
    # Source-build (Phase 6 binary-repackage was reverted because the
    # upstream Linux binary links against EOL OpenSSL 1.1 — see
    # saramibreak/DiscImageCreator#321). spectool -g fetches all four
    # upstream source tarballs (DIC + EccEdc + DVDAuth + unscrambler);
    # SRPM packs them all. DIC is pinned to a master COMMIT (not a release
    # tag): Source0 is a deterministic archive URL from %global diccommit,
    # and watch-dic-releases.yml re-pins it on every new master commit.
    # The DiscImageCreator-*.tar.gz glob still matches the SHA-named archive.
    actions:
      # Mandatory — see the mpf block: without it Packit takes the version from
      # the newest git tag in this repo, not from the spec.
      get-current-version:
        - bash -c "rpmspec -q --queryformat '%{version}\n' discimagecreator.spec | head -1"
      create-archive:
        - bash -c "spectool -g discimagecreator.spec 1>&2"
        - bash -c "ls -1 DiscImageCreator-*.tar.gz | head -1"

  aaru:
    paths:
      - fedora/aaru/
    specfile_path: aaru.spec
    upstream_project_url: https://github.com/aaru-dps/Aaru
    # Aaru is currently on v6 alpha pre-releases; we pin manually in
    # the spec (no watcher). spectool -g pulls both upstream tarballs
    # (prebuilt linux_amd64 binary + signed source) and the SRPM packs
    # them both.
    actions:
      # Mandatory — see the mpf block: without it Packit takes the version from
      # the newest git tag in this repo, not from the spec.
      get-current-version:
        - bash -c "rpmspec -q --queryformat '%{version}\n' aaru.spec | head -1"
      create-archive:
        - bash -c "spectool -g aaru.spec 1>&2"
        # Match the tarball by SHAPE, never by version: spectool fetches whatever
        # Source0 names, so pinning a version here just means this line has to be
        # edited in lockstep with the spec -- and it never was. It sat at
        # `alpha.19` from March until upstream shipped beta.1 (2026-07-16); the
        # watcher rewrote %global aaruprerel, spectool duly fetched
        # aaru-6.0.0-beta.1_linux_amd64.tar.xz, this `ls` still looked for
        # alpha.19, matched nothing, and packit failed with "create-archive did
        # not output a path". ANY version move would have done it, alpha.20
        # included -- the version simply had not moved since the line was written.
        # aaru5 already had the right shape; this is now the same. The `_linux_amd64`
        # infix keeps it off Source1 (aaru-src-<ver>.tar.xz), which spectool also
        # fetches into this directory.
        - bash -c "ls -1 aaru-*_linux_amd64.tar.xz | head -1"

  # Stable Aaru 5.x, packaged SEPARATELY from the rolling v6 `aaru` above
  # (different binary name / libdir / manpage — co-installable). MPF only
  # supports stable Aaru, so this is the build it drives for floppy/optical
  # dumping. Manually pinned in the spec (no watcher). spectool -g pulls
  # just the prebuilt linux_amd64 tarball (no source tarball — this backend
  # ships no icons/desktop/MIME).
  aaru5:
    paths:
      - fedora/aaru5/
    specfile_path: aaru5.spec
    upstream_project_url: https://github.com/aaru-dps/Aaru
    actions:
      # Mandatory — see the mpf block: without it Packit takes the version from
      # the newest git tag in this repo, not from the spec.
      get-current-version:
        - bash -c "rpmspec -q --queryformat '%{version}\n' aaru5.spec | head -1"
      create-archive:
        - bash -c "spectool -g aaru5.spec 1>&2"
        - bash -c "ls -1 aaru-*_linux_amd64.tar.xz | head -1"

  # ---------------------------------------------------------------------------
  # PINNED-BUILD COMPATIBILITY PACKAGES (redumper<N>)
  #
  # One package PER BUILD, never per consumer. That is the whole trick, and it is
  # what keeps this from turning into a mess when two frontends pin the same
  # build: they simply both depend on redumper<N>. There is no name under which a
  # second copy of the same build could even come into existence, and
  # /usr/bin/redumper<N> exists exactly once. If redumper-gui ever moves to b732,
  # it just starts depending on redumper-mpf next to MPF — nothing is duplicated.
  #
  # ⚠️ The flip side, and the only real hazard here: the moment NO consumer points
  # at a redumper<N> any more, that package is an ORPHAN. It will keep building and
  # keep being published in COPR, the PPA and OBS forever, because nothing notices.
  # Retiring it is a manual act (`copr-cli delete-package`, and drop the recipe) —
  # scripts/status.sh lists pins that no consumer references, so it does not rot in
  # silence.
  #
  # No watcher on any of these, on purpose: a PIN THAT MOVES IS NOT A PIN. They
  # advance only when a CONSUMER advances, and then a NEW package is generated.
  # ---------------------------------------------------------------------------

  # redumper-gui's pin. Its upstream bundles b729 and states that other versions
  # may not be supported, and it invokes redumper as a sibling of its own binary,
  # which a distro cannot honour by shipping a second /usr/bin/redumper.
  redumper-rgui:
    paths:
      - fedora/redumper-rgui/
    specfile_path: redumper-rgui.spec
    upstream_project_url: https://github.com/superg/redumper
    actions:
      # MANDATORY, not cosmetic. Without it Packit derives the version from the
      # ARCHIVE NAME and rewrites Version: with it -- measured 2026-07-13, COPR
      # build 10712779 shipped as `redumper-rgui-redumper.gui.1.0.1-1` instead of
      # `redumper-rgui-729-1`. The spec is the source of truth for the version;
      # read it from there. (The rolling `redumper` block has had this all along.)
      get-current-version:
        - bash -c "rpmspec -q --queryformat '%{version}\n' redumper-rgui.spec | head -1"
      create-archive:
        - bash -c "spectool -g redumper-rgui.spec 1>&2"
        - bash -c "ls -1 redumper-b729-linux-x64.zip"

  # MPF's pin. b732 is what MPF's publish-nix.sh bundles. It stays pinned even
  # while the rolling `redumper` carries the same build (it does today): the
  # rolling package moves, MPF has no version check, and an MPF pointed at it
  # would silently dump with an untested build the day b733 lands.
  redumper-mpf:
    paths:
      - fedora/redumper-mpf/
    specfile_path: redumper-mpf.spec
    upstream_project_url: https://github.com/superg/redumper
    actions:
      # See redumper-rgui above -- same mandatory version read from the spec.
      get-current-version:
        - bash -c "rpmspec -q --queryformat '%{version}\n' redumper-mpf.spec | head -1"
      create-archive:
        - bash -c "spectool -g redumper-mpf.spec 1>&2"
        - bash -c "ls -1 redumper-b732-linux-x64.zip"

  # Source0 is the VENDORED tarball published as a release asset on THIS repo
  # (scripts/rust-vendor-tarball.sh), not an upstream archive: Rust needs its
  # crates at build time and the COPR chroot has no network. Source1/2 are
  # local files and therefore FLAT basenames — Packit stages local sources into
  # the srcdir root, so a subdirectory in the Source: line would not resolve.
  redumper-gui:
    paths:
      - fedora/redumper-gui/
    specfile_path: redumper-gui.spec
    upstream_project_url: https://github.com/Deterous/Redumper-GUI
    actions:
      # See redumper-rgui above -- same trap, and this package is where it bit:
      # the archive is named redumper-gui-1.0.1-vendored.tar.xz, from which
      # Packit inferred the version `redumper.gui.1.0.1` and stamped it into
      # BOTH new packages. Always read the version from the spec.
      get-current-version:
        - bash -c "rpmspec -q --queryformat '%{version}\n' redumper-gui.spec | head -1"
      create-archive:
        - bash -c "spectool -g redumper-gui.spec 1>&2"
        - bash -c "ls -1 redumper-gui-*-vendored.tar.xz | head -1"

jobs:
  # Per-package commit jobs, each pinned to its OWN trigger branch
  # (build-<tool>). Two mechanisms together keep `dnf` clients from ever
  # hitting a checksum mismatch — WITHOUT polluting the NEVRA:
  #
  # 1. BRANCH-SCOPING — only the changed tool rebuilds.
  #    Packit has no working path-based job filter for trigger: commit
  #    (the package-level paths: field only scopes SRPM source
  #    extraction, NOT triggering — packit-service#2006 / PR #2780 still
  #    unmerged as of 2026-06). So triggers are isolated by BRANCH: a
  #    push to main builds nothing (no job watches main); each tool's
  #    watcher first pushes the canonical commit to main (builds
  #    nothing), then recreates its build-<tool> branch with a short,
  #    branch-specific landing README and force-pushes it (the README
  #    diff means build-<tool> is not a fast-forward of main; trigger
  #    refs are disposable so the force-push is harmless). That fires
  #    ONLY that tool's job.
  #
  #    ANCHOR THE BRANCH NAMES. `branch:` is a REGEX, matched with re.match(),
  #    which anchors at the START only (packit-service, build_helper.py ->
  #    is_job_config_trigger_matching). An unanchored `build-aaru` therefore
  #    ALSO matches the branch `build-aaru5`: on 2026-07-11 a push to
  #    build-aaru5 fired the aaru job too and rebuilt aaru under its unchanged
  #    NEVRA (COPR 10708963 = package `aaru`, branch `build-aaru5`) — the exact
  #    same-NEVRA republish that branch-scoping exists to prevent. Hence the
  #    ^...$ anchors below; they are load-bearing whenever one tool name is a
  #    prefix of another (aaru / aaru5).
  #
  # 2. update_release: false + a same-NEVRA guard — clean, unique NEVRA.
  #    update_release stays false so the published NEVRA is EXACTLY what
  #    the spec says (our convention: bare-N Release, no build suffix —
  #    e.g. redumper-724-2, mpf-3.7.1~<snap>-5). Same-NEVRA republish
  #    (which would hand dnf a new checksum for an unchanged NEVRA) is
  #    prevented at the source instead: the watchers always bump Version /
  #    reset Release on a real upstream change, and MANUAL builds go
  #    through scripts/build-tool.sh, which compares the spec NEVRA
  #    against the latest already in COPR and auto-bumps the bare-N
  #    Release if it wouldn't be strictly newer. So every build that
  #    reaches COPR has a clean, strictly-higher NEVRA. Do NOT hand-run
  #    `git push origin main:build-<tool>`; use scripts/build-tool.sh.
  #
  # All four tools have GitHub-hosted watchers that rewrite the spec on
  # upstream releases and commit — Packit then auto-builds the COPR
  # update from that commit. No `pull_from_upstream` jobs because none of
  # these tools are packaged in Fedora's official dist-git.
  #
  # No `pull_request` job either: with an explicit owner/project a PR build
  # lands in the PRODUCTION Copr with the spec's exact NEVRA (update_release
  # is false) -> same-NEVRA republish -> dnf checksum break. We work
  # directly on main. If PR test builds are ever wanted, add a pull_request
  # job WITHOUT owner/project so Packit uses a throwaway per-PR project
  # ({namespace}-{repo}-{pr_id}), never production.
  #
  # TARGETS: x86_64 on fedora-all + epel-all for every job. aarch64 is being
  # added per-package as each spec learns to bundle the upstream linux-arm64
  # asset and select it via %ifarch (redumper first -- see its spec). A job
  # only gains fedora-all-aarch64 + epel-all-aarch64 once ITS spec is
  # ExclusiveArch: x86_64 aarch64; adding the target before that would ask COPR
  # to build an x86_64-only SRPM on an aarch64 chroot. Enabling the chroot on
  # the COPR project is NOT enough on its own -- Packit's targets here are the
  # real gate, and it (re)enables whatever chroots these aliases expand to.
  # epel-all auto-tracks every active EPEL major (8/9/10 today, 11+
  # automatically) so nothing is version-pinned. The epel builds run on the
  # CentOS Stream N + EPEL buildroot, so a single .elN package covers RHEL,
  # CentOS Stream, AlmaLinux, Rocky and Oracle N alike. arm64 ships UNTESTED
  # (no hardware drive-access proof); the repackage path is arch-neutral.
  #
  # openSUSE is intentionally NOT built on COPR: COPR only offers Leap 15.6
  # (EOL 2026-04-30) plus a currently-broken Tumbleweed, and has no Leap 16.0
  # chroot -- 3rd-party-distro support there lags badly. openSUSE will be done
  # natively on OBS (build.opensuse.org) instead; the specs keep their
  # `%if 0%{?suse_version}` portability (ninja name, <limits.h>, .NET dep-name
  # mapping -- a verified no-op on Fedora/EL) for that OBS reuse. Ubuntu/Debian
  # go via a Launchpad PPA (next up). See TODO #51 / #49.
  - job: copr_build
    trigger: commit
    branch: ^build-redumper$
    packages: [redumper]
    update_release: false
    owner: gmipf
    project: media-preservation
    targets:
      - fedora-all-x86_64
      - epel-all-x86_64
      - fedora-all-aarch64
      - epel-all-aarch64

  - job: copr_build
    trigger: commit
    branch: ^build-mpf$
    packages: [mpf]
    update_release: false
    owner: gmipf
    project: media-preservation
    targets:
      - fedora-all-x86_64
      - epel-all-x86_64

  # discimagecreator: master-commit snapshot version
  # (<YYYYMMDDHHMMSS>.<short-SHA>, the UTC commit timestamp) is monotonic by
  # the commit timestamp and already sorts above the old bare-tag builds.
  # No auto-suffix needed.
  - job: copr_build
    trigger: commit
    branch: ^build-dic$
    packages: [discimagecreator]
    update_release: false
    owner: gmipf
    project: media-preservation
    targets:
      - fedora-all-x86_64
      - epel-all-x86_64

  # aaru: spec-supplied (6.0.0-0.alpha.19.1) is monotonic; on next
  # upstream alpha bump the Release segment goes up.
  - job: copr_build
    trigger: commit
    branch: ^build-aaru$
    packages: [aaru]
    update_release: false
    owner: gmipf
    project: media-preservation
    targets:
      - fedora-all-x86_64
      - epel-all-x86_64

  # aaru5: stable 5.x, own trigger branch. Manually pinned; bump Release
  # via scripts/build-tool.sh on a manual rebuild.
  - job: copr_build
    trigger: commit
    branch: ^build-aaru5$
    packages: [aaru5]
    update_release: false
    owner: gmipf
    project: media-preservation
    targets:
      - fedora-all-x86_64
      - epel-all-x86_64

  # redumper-rgui: coupled to the redumper-gui release (bumped WITH it, not hourly);
  # watch-consumer-pins.yml guards it and fails loudly on drift, it does not bump it.
  # The ^...$ anchors matter more here than anywhere: `build-redumper` without
  # them would also match `build-redumper-rgui` AND `build-redumper-gui`, and the
  # rolling redumper would get rebuilt under an unchanged NEVRA — exactly the
  # aaru/aaru5 incident of 2026-07-11.
  - job: copr_build
    trigger: commit
    branch: ^build-redumper-rgui$
    packages: [redumper-rgui]
    update_release: false
    owner: gmipf
    project: media-preservation
    targets:
      - fedora-all-x86_64
      - epel-all-x86_64
      - fedora-all-aarch64
      - epel-all-aarch64

  # redumper-mpf: MPF's pinned build, AUTO-tracked hourly by watch-consumer-pins.yml
  # (fixed name, moving version -> in-place bump). Same anchoring requirement as
  # redumper-rgui above -- and note that an unanchored `build-redumper`
  # would now match THREE branches, not two.
  - job: copr_build
    trigger: commit
    branch: ^build-redumper-mpf$
    packages: [redumper-mpf]
    update_release: false
    owner: gmipf
    project: media-preservation
    targets:
      - fedora-all-x86_64
      - epel-all-x86_64
      - fedora-all-aarch64
      - epel-all-aarch64

  # redumper-gui: Rust/egui frontend. MSRV 1.92 (from eframe/egui 0.35, measured)
  # is satisfied on Fedora 43+ (1.96) and on EL 8/9/10 (1.92 — exactly the floor,
  # zero headroom), so fedora-all + epel-all both build. Debian 12 and the older
  # Ubuntu LTS releases cannot and are not targeted anywhere.
  - job: copr_build
    trigger: commit
    branch: ^build-redumper-gui$
    packages: [redumper-gui]
    update_release: false
    owner: gmipf
    project: media-preservation
    targets:
      - fedora-all-x86_64
      - epel-all-x86_64
